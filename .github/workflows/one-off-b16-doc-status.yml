name: One-off B16 documentation status
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  docs-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update engagement and release status headers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/ENGAGEMENT_ROADMAP.md')
          s=p.read_text()
          old='Status: planned, not implemented. The deployed baseline is v1.2.0. This document plans connection cards, personal character arcs, community projects, and small Fantasy/Cyberpunk/Wasteland starter packs. Version targets describe delivery order, not calendar commitments.'
          new='Status: Batches 13–16 are implemented on `main`; production is deployed through Batch 15 / v1.5.0. Batch 16 / v1.6.0 is built and verified but has not yet been promoted to production. Batch 17 remains planned. Version targets describe delivery order, not calendar commitments.'
          if s.count(old)!=1: raise SystemExit(f'roadmap status matches: {s.count(old)}')
          s=s.replace(old,new)
          s=s.replace('| 13 | v1.3 — Connection cards |','| 13 ✓ | v1.3 — Connection cards |',1)
          s=s.replace('| 14 | v1.4 — Personal character arcs |','| 14 ✓ | v1.4 — Personal character arcs |',1)
          s=s.replace('| 15 | v1.5 — Community projects |','| 15 ✓ | v1.5 — Community projects |',1)
          s=s.replace('| 16 | v1.6 — Project contributions and consequences |','| 16 ✓ | v1.6 — Project contributions and consequences |',1)
          p.write_text(s)

          p=Path('docs/STATUS.md')
          s=p.read_text()
          header='''# ORACLE v1.6.0 — Batch 16 candidate\n\nRecorded September 7, 2026.\n\nBatch 16 is implemented and verified on `main` but is **not yet deployed**. Production remains ORACLE v1.5.0 / Batch 15 at release `2a615cbb48dc55cc808640072909a7c13894cd6f`. The v1.6.0 candidate advances SQL schema to 14 and adds verified project evidence, atomic player-confirmed resource donations, bounded project consequences, explicit refunds/corrections, upgraded themed starter projects, and a v1.6 immutable offline shell. See [BATCH16_PROJECT_EFFECTS.md](BATCH16_PROJECT_EFFECTS.md).\n\nThe clean Batch 16 implementation passed the normal ORACLE gate: full application verification including dedicated mixed-mode project tests, the 100-authenticated-player isolated PostgreSQL rehearsal, populated backup/restore including the new project tables, repeat schema migration/startup, exact production-image build, and production-session configuration. This is automated evidence only; human/device field acceptance and sustained Railway capacity remain separate.\n\n---\n\n## Previous deployed-status record\n\n'''
          if not s.startswith('# ORACLE v1.6.0 — Batch 16 candidate'):
              s=header+s
          p.write_text(s)
          PY
          git diff --check
      - name: Commit documentation status
        run: |
          git config user.name 'ORACLE maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/ENGAGEMENT_ROADMAP.md docs/STATUS.md
          git commit -m 'Update ORACLE roadmap and status for Batch 16'
          git push origin HEAD:main

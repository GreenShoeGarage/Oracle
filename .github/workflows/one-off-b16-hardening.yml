name: One-off B16 hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden project effects and recovery gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/project-effects-app.js')
          s=p.read_text()
          old="let resources=[],evidence=[];if(character){resources=(await pool.query(`SELECT r.id,r.name,COALESCE(b.quantity,0)::int quantity FROM economy_resources r LEFT JOIN economy_balances b ON b.event_id=r.event_id AND b.resource_id=r.id AND b.character_id=$2 WHERE r.event_id=$1 ORDER BY r.name`,[eventId,character.id])).rows;evidence=await listEligibleEvidence(pool,eventId,user,character);}let consequences=[],donations=[];"
          new="let resources=[],evidence=[];if(character){resources=(await pool.query(`SELECT r.id,r.name,COALESCE(b.quantity,0)::int quantity FROM economy_resources r LEFT JOIN economy_balances b ON b.event_id=r.event_id AND b.resource_id=r.id AND b.character_id=$2 WHERE r.event_id=$1 ORDER BY r.name`,[eventId,character.id])).rows;evidence=await listEligibleEvidence(pool,eventId,user,character);}else if(managers.has(event.role)){resources=(await pool.query('SELECT id,name,0::int quantity FROM economy_resources WHERE event_id=$1 ORDER BY name,id',[eventId])).rows;}let consequences=[],donations=[];"
          if s.count(old)!=1: raise SystemExit(f'manager resources marker: {s.count(old)}')
          s=s.replace(old,new)

          old="if(existing){if(existing.user_id!==user.id||existing.project_id!==projectId)fail(409,'This request identity was already used.');await client.query('COMMIT');return send(res,200,{contribution:existing,replayed:true}),true;}const verified=await verifyEvidence"
          new="if(existing){if(existing.user_id!==user.id||existing.project_id!==projectId||existing.character_id!==character.id||existing.milestone_id!==milestone.id||existing.source_kind!==input.sourceKind||existing.source_id!==input.sourceId)fail(409,'This request identity was already used with different evidence terms.');await client.query('COMMIT');return send(res,200,{contribution:existing,replayed:true}),true;}const currentProgress=(await milestoneProgress(client,eventId,projectId)).find(row=>row.id===milestone.id);if(Number(currentProgress?.accepted_count||0)>=milestone.required_count)fail(409,'This evidence milestone is already complete.');const verified=await verifyEvidence"
          if s.count(old)!=1: raise SystemExit(f'evidence replay marker: {s.count(old)}')
          s=s.replace(old,new)

          old="if(existing){if(existing.user_id!==user.id||existing.project_id!==projectId)fail(409,'This request identity was already used.');await client.query('COMMIT');return send(res,200,{contribution:existing,replayed:true}),true;}const balance=(await client.query"
          new="if(existing){if(existing.user_id!==user.id||existing.project_id!==projectId||existing.character_id!==character.id||existing.milestone_id!==milestone.id||existing.kind!=='resource'||Number(existing.units)!==quantity)fail(409,'This request identity was already used with different donation terms.');await client.query('COMMIT');return send(res,200,{contribution:existing,replayed:true}),true;}const currentProgress=(await milestoneProgress(client,eventId,projectId)).find(row=>row.id===milestone.id),remaining=milestone.required_count-Number(currentProgress?.accepted_count||0);if(remaining<=0)fail(409,'This resource milestone is already complete.');if(quantity>remaining)fail(409,`Only ${remaining} unit${remaining===1?'':'s'} are still needed for this milestone.`);const balance=(await client.query"
          if s.count(old)!=1: raise SystemExit(f'donation replay marker: {s.count(old)}')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('scripts/recovery-rehearsal.js')
          s=p.read_text()
          needle='    ["schema_migrations", "version"],'
          addition='''    ["community_projects", "id"],\n    ["community_project_milestones", "id"],\n    ["community_project_contributions", "id"],\n    ["community_project_receipts", "id"],\n    ["community_project_consequences", "id"],\n    ["community_project_effects", "id"],\n    ["community_project_refunds", "id"],\n'''
          if '    ["community_project_effects", "id"],' not in s:
              if s.count(needle)!=1: raise SystemExit('recovery schema marker missing')
              s=s.replace(needle,addition+needle)
          p.write_text(s)

          p=Path('public/install-v16.js')
          s=p.read_text().replace("'\\\"':'&quot'", "'\\\"':'&quot;'")
          p.write_text(s)
          PY
          git diff --check
          node --check src/project-effects-app.js
      - name: Commit hardening
        run: |
          git config user.name 'ORACLE maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/project-effects-app.js scripts/recovery-rehearsal.js public/install-v16.js
          git commit -m 'Harden Batch 16 retries capacity and recovery checks'
          git push origin HEAD:main

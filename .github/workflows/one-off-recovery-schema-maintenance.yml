name: One-off recovery schema maintenance
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update-recovery-schema:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update exact recovery schema assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/recovery-rehearsal.js')
          s=p.read_text()
          old='assert.equal(await migrate(restored), 10, "The recovered database must accept repeat migration at schema 10.");'
          new='assert.equal(await migrate(restored), 13, "The recovered database must accept repeat migration at schema 13.");'
          if s.count(old) != 1:
              raise SystemExit(f'expected one exact schema assertion, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Commit recovery maintenance
        shell: bash
        run: |
          git config user.name 'ORACLE maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/recovery-rehearsal.js
          git commit -m 'Update recovery rehearsal for schema 13'
          git push origin HEAD:main

name: One-off v17 docs tour
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  docs-tour:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Align v1.7 documentation and public tour
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/ENGAGEMENT_ROADMAP.md'); s=p.read_text()
          s=s.replace('Status: Batches 13–16 are implemented on `main`; production is deployed through Batch 15 / v1.5.0. Batch 16 / v1.6.0 is built and verified but has not yet been promoted to production. Batch 17 remains planned. Version targets describe delivery order, not calendar commitments.','Status: Batches 13–17 are implemented on `main`; production is deployed through Batch 16 / v1.6.0. Batch 17 / v1.7.0 is the current candidate and is not yet deployed. Version targets describe delivery order, not calendar commitments.')
          s=s.replace('| 17 | v1.7 — Complete starter experiences |','| 17 ✓ | v1.7 — Complete starter experiences |',1)
          s=s.replace('First implementation target: **Batch 13 — Connection cards**. Batch 14 depends on its assignment/privacy foundation; Batch 15 adds shared project state; Batch 16 adds verified effects; Batch 17 combines the delivered features into polished starter experiences.','Batches 13–17 are implemented. The next product cycle should be driven by field observations, mobile/offline ergonomics, organizer workload, and newcomer comprehension rather than another major gameplay subsystem.')
          p.write_text(s)

          p=Path('docs/STATUS.md'); s=p.read_text()
          header='''# ORACLE v1.7.0 — Batch 17 candidate\n\nRecorded September 8, 2026.\n\nBatch 17 is implemented on `main` but is **not yet deployed**. Production remains ORACLE v1.6.0 / Batch 16 at release `2b9b625cdcf5b7ad9ac01074f5ac79c92cfaba4f`. The v1.7.0 candidate advances SQL schema to 15 and adds versioned complete starter experiences, a combined player next-action workspace, printable organizer run sheets, public no-account starter examples, and an immutable v1.7 offline shell.\n\nThe candidate intentionally installs authored definitions only. It never creates or copies player connection responses, mutual consent, arc progress/reflections, community-project contributions, donations, effects, rewards, or refunds. Human/device field acceptance remains outstanding and is not implied by automated verification.\n\n---\n\n## Previous deployed-status record\n\n'''
          if not s.startswith('# ORACLE v1.7.0 — Batch 17 candidate'): s=header+s
          p.write_text(s)

          p=Path('README.md'); s=p.read_text()
          s=s.replace('v1.6.0','v1.7.0',1)
          if 'Complete starter experiences' not in s:
              marker='## What ORACLE includes\n'
              if marker in s: s=s.replace(marker,marker+'\n- Complete themed starter experiences that assemble connection cards, personal arcs, community projects, bounded consequences, and printable organizer guidance into one 30–45 minute flow.\n',1)
          p.write_text(s)

          p=Path('public/tour.html'); s=p.read_text()
          if '/starter-experiences.html' not in s:
              link='<p class="tour-cta"><a class="button" href="/starter-experiences.html">See the complete starter experiences</a></p>'
              if '</main>' not in s: raise SystemExit('tour main close not found')
              s=s.replace('</main>',link+'\n</main>',1)
          p.write_text(s)

          p=Path('scripts/check.js'); s=p.read_text()
          if 'public/starter-experiences.html' not in s:
              needle='"public/experiences.css"'
              s=s.replace(needle,needle+',"public/starter-experiences.html"',1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit documentation and public tour alignment
        run: |
          git config user.name 'ORACLE maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/ENGAGEMENT_ROADMAP.md docs/STATUS.md README.md public/tour.html scripts/check.js
          git commit -m 'Align ORACLE roadmap status and public tour with Batch 17'
          git push origin HEAD:main

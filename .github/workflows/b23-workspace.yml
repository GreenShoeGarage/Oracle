name: B23 isolated workspace
on:
  push:
    branches: [feature/batches20-23-experience-studio]
    paths: [.github/workflows/b23-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: tar --exclude=.git --exclude=workspace.tgz -czf /tmp/workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-b23-workspace
          path: /tmp/workspace.tgz
          retention-days: 1

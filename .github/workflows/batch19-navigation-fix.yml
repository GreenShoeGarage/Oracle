name: Batch 19 navigation correction
on:
  push:
    branches: [release/batch19-command-deck]
    paths: [.github/workflows/batch19-navigation-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep display controls local and close the deck for player preview
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/app.js'); s=p.read_text()
          old='    if (state.view === "stagehand" && !destination.startsWith("stagehand-")) stagehand.reset();\n  }\n  if (state.view === "command-deck" && !destination.startsWith("command-deck-")) commandDeck.reset();'
          new='    if (state.view === "stagehand" && !destination.startsWith("stagehand-")) stagehand.reset();\n    if (state.view === "command-deck" && !destination.startsWith("command-deck-")) commandDeck.reset();\n  }\n  if (state.view === "command-deck" && destination === "kit-view") {\n    commandDeck.reset();\n    state.view = "detail";\n  }'
          assert s.count(old)==1, 'Unexpected dispatcher; no replacement applied'
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/batch19-navigation-fix.yml').unlink()
          PY
          node --check public/app.js
          node --test test/command-deck-navigation.test.js
          git diff --check
      - name: Commit correction on the release branch only
        run: |
          git config user.name 'ORACLE maintenance bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve Command Deck display controls and close private reports on audience changes'
          git push origin HEAD:release/batch19-command-deck

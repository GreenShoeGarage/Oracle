services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: oracle
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD for your local database}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - oracle_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle -d oracle"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  oracle_data:
